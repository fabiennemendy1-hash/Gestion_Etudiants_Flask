<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESTM CONNECT{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --main-color: #004a99; --accent-color: #f8fafc; }
        body { background-color: var(--accent-color); font-family: 'Inter', sans-serif; }
        
        .navbar-custom {
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 15px 0;
        }
        .navbar-brand {
            font-weight: 800;
            color: var(--main-color) !important;
            letter-spacing: 1px;
        }
        .nav-link-custom {
            color: #475569 !important;
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 20px;
            text-transform: uppercase;
        }
        .btn-logout {
            border: 1px solid #cbd5e1;
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 15px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom mb-5">
    <div class="container">
        <a class="navbar-brand" href="#">ESTM <span style="color:#0f172a">CONNECT</span></a>
        <div class="ms-auto d-flex align-items-center">
            <a class="nav-link nav-link-custom" href="/dashboard">Tableau de Bord</a>
            <a class="nav-link nav-link-custom" href="/ajouter">Inscriptions</a>
            <a href="/login" class="btn btn-logout ms-4">DÉCONNEXION</a>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
