<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | ESTM CONNECT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        
        /* Hero Section avec image d'excellence */
        .hero {
            background: linear-gradient(rgba(0, 74, 153, 0.7), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=2070');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero-content { max-width: 800px; margin: auto; padding: 20px; }
        
        .school-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 { font-size: 4rem; font-weight: 800; margin-bottom: 20px; }
        .lead { font-size: 1.5rem; margin-bottom: 40px; opacity: 0.9; }

        .btn-portal {
            background: #ffffff;
            color: #004a99;
            padding: 15px 40px;
            font-weight: 700;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.3s;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-portal:hover {
            background: #004a99;
            color: white;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <div class="school-badge text-white">Éducation • Innovation • Excellence</div>
            <h1>ESTM CONNECT</h1>
            <p class="lead">Le portail numérique nouvelle génération pour la gestion des parcours académiques et professionnels.</p>
            
            <div class="mt-5">
                <a href="/login" class="btn-portal">ACCÉDER À L'ESPACE SCOLARITÉ</a>
            </div>
        </div>
    </section>

</body>
</html>
