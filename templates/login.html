<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion ESTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary d-flex align-items-center" style="height: 100vh;">
    <div class="card mx-auto p-4 shadow-lg" style="width: 350px;">
        <h3 class="text-center text-primary mb-4">ESTM SCOLARITÉ</h3>
        <form action="/login" method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Identifiant" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
    </div>
</body>
</html>
