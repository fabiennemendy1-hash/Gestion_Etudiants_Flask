<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Professionnelle | ESTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; height: 100vh; display: flex; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 5px solid #003366; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-box">
            <h3 class="text-center fw-bold mb-4" style="color:#003366;">IDENTIFICATION</h3>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">UTILISATEUR</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">MOT DE PASSE</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn w-100 text-white fw-bold" style="background:#003366;">SE CONNECTER</button>
            </form>
        </div>
    </div>
</body>
</html>
