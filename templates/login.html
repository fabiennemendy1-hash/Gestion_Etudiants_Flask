<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTM CONNECT | Authentification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* Image de fond académique professionnelle */
        .bg-overlay {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                        url('https://images.unsplash.com/photo-1523050335392-9bc5675e7753?q=80&w=2070'); 
            background-size: cover;
            background-position: center;
            height: 100%;
            width: 100%;
            position: fixed;
            z-index: -1;
        }

        .login-wrapper {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 2px; /* Style institutionnel strict */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        /* Barre supérieure décorative aux couleurs de l'école */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #004a99;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 1px;
        }

        .brand-tagline {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
        }

        h2 {
            font-size: 1.25rem;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-control {
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 12px;
            background: #f8fafc;
        }

        .form-control:focus {
            background: #fff;
            border-color: #004a99;
            box-shadow: 0 0 0 4px rgba(0, 74, 153, 0.1);
        }

        .btn-login {
            background: #004a99;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px;
            width: 100%;
            font-weight: 700;
            margin-top: 20px;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #003366;
            transform: translateY(-1px);
        }

        .support-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .support-link:hover {
            color: #004a99;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="top-bar"></div>
            
            <div class="brand-header">
                <div class="brand-name">ESTM CONNECT</div>
                <div class="brand-tagline">Portail de Gestion Académique</div>
            </div>
            
            <h2>Authentification</h2>
            
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">IDENTIFIANT</label>
                    <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">MOT DE PASSE</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login">ACCÉDER À L'ESPACE</button>
            </form>
            
            <a href="#" class="support-link">Besoin d'assistance technique ?</a>
        </div>
    </div>

</body>
</html>
