<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion | ESTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); height: 100vh; display: flex; align-items: center; }
        .login-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #e2e8f0; }
        .btn-login { background: #3b82f6; color: white; border-radius: 10px; padding: 12px; font-weight: bold; width: 100%; border: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-card text-center">
            <h2 class="fw-bold text-dark mb-2">ESTM</h2>
            <p class="text-muted mb-4">Portail d'Administration</p>
            <form action="/login" method="POST">
                <input type="text" name="username" class="form-control mb-3" placeholder="Identifiant" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Mot de passe" required>
                <button type="submit" class="btn-login shadow">Se connecter</button>
            </form>
        </div>
    </div>
</body>
</html>
