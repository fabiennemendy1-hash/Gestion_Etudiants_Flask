<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | ESTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6; /* Gris très clair pour le fond */
            height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 5px solid #1e293b; /* Barre supérieure sombre */
        }
        .brand-name {
            color: #1e293b;
            font-weight: 800;
            letter-spacing: -1px;
            font-size: 2rem;
        }
        .form-label {
            font-weight: 600;
            color: #4b5563;
            font-size: 0.85rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #d1d5db;
            background-color: #f9fafb;
        }
        .form-control:focus {
            border-color: #1e293b;
            box-shadow: none;
            background-color: #fff;
        }
        .btn-login {
            background: #1e293b; /* Couleur sombre pro */
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            border: none;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #334155;
            transform: translateY(-1px);
        }
        .footer-text {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card">
            <div class="text-center mb-4">
                <h1 class="brand-name">ESTM</h1>
                <p class="text-muted small text-uppercase fw-bold">Gestion des Notes</p>
            </div>
            
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Identifiant Administrateur</label>
                    <input type="text" name="username" class="form-control" placeholder="ex: admin_estm" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login shadow-sm">Accéder au Dashboard</button>
            </form>

            <div class="text-center footer-text">
                &copy; 2026 École Supérieure de Technologie et de Management
            </div>
        </div>
    </div>

</body>
</html>
