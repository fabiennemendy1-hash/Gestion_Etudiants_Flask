<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion ESTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary d-flex align-items-center" style="height: 100vh;">
    <div class="card mx-auto p-4 shadow-lg" style="width: 380px;">
        <h3 class="text-center text-primary mb-4">ESPACE ADMIN</h3>
        <form action="/login" method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Utilisateur" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Mot de passe" required>
            <button class="btn btn-primary w-100 py-2">Se connecter</button>
        </form>
    </div>
</body>
</html>
