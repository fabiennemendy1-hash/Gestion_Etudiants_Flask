<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de Bord</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="#">Système Scolaire (60 Crédits)</a>
        <a href="/" class="btn btn-outline-danger btn-sm">Déconnexion</a>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <h2>Liste des Étudiants</h2>
            <button class="btn btn-success">+ Nouvel Étudiant</button>
        </div>
        
        <table class="table table-hover border">
            <thead class="table-light">
                <tr>
                    <th>Matricule</th>
                    <th>Nom & Prénom</th>
                    <th>Filière</th>
                    <th>Moyenne</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
    {% for etu in etudiants %}
    <tr>
        <td>{{ etu.matricule }}</td>
        <td>{{ etu.nom }} {{ etu.prenom }}</td>
        <td>{{ etu.filiere }}</td>
        <td>
            <span class="badge bg-info">En attente</span>
        </td>
        <td>
            <a href="/bulletin/{{ etu.id }}" class="btn btn-sm btn-primary">Voir Bulletin</a>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="5" class="text-center text-muted">Aucun étudiant enregistré pour le moment.</td>
    </tr>
    {% endfor %}
</tbody>        </table>
    </div>
</body>
</html>
