<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrire un Étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>Nouvelle Inscription</h3>
                    </div>
                    <div class="card-body">
                        <form action="/ajouter" method="POST">
                            
                            <div class="mb-3">
                                <label for="nom" class="form-label">Nom de l'étudiant</label>
                                <input type="text" name="nom" id="nom" class="form-control" placeholder="Ex: Diop" required>
                            </div>

                            <div class="mb-3">
                                <label for="prenom" class="form-label">Prénom de l'étudiant</label>
                                <input type="text" name="prenom" id="prenom" class="form-control" placeholder="Ex: Moussa" required>
                            </div>

                            <div class="mb-3">
                                <label for="matricule" class="form-label">Matricule</label>
                                <input type="text" name="matricule" id="matricule" class="form-control" placeholder="Ex: ESTM-2024" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Enregistrer l'étudiant</button>
                                <a href="/dashboard" class="btn btn-outline-secondary">Annuler</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
