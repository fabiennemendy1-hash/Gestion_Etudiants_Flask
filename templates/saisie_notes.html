<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des Notes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Enregistrer une Note</h3>
        </div>
        <div class="card-body">
            <form action="/ajouter_note" method="POST">
                
                <div class="mb-3">
                    <label class="form-label">ID de l'Étudiant</label>
                    <input type="number" name="etudiant_id" class="form-control" placeholder="Ex: 1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Matière</label>
                    <select name="matiere" class="form-select" required>
                        <option value="Informatique">Informatique (20 crédits)</option>
                        <option value="Mathématiques">Mathématiques (15 crédits)</option>
                        <option value="Anglais">Anglais (10 crédits)</option>
                        <option value="Gestion">Gestion (15 crédits)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Note (sur 20)</label>
                    <input type="number" step="0.25" name="note" class="form-control" min="0" max="20" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/dashboard" class="btn btn-secondary">Retour</a>
                    <button type="submit" class="btn btn-success">Valider la note</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
